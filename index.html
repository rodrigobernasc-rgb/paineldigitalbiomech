<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Instituto Biomech</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --ink:#0E2A3B; --teal:#0EA5A5; --slate:#5B7280; --mute:#8A9BA6; --bg:#F4F7F9;
  --card:#FFFFFF; --line:#E4EBEF; --ig:#D6256E; --kiwi:#16A34A; --cardc:#F59E0B;
  --green:#157F52; --red:#C0392B; --amber:#E0900B;
  --posbg:#E7F6EF; --negbg:#FCEAEA; --neubg:#EEF2F4;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;}
.wrap{max-width:1180px;margin:0 auto;padding:18px 20px 60px;}
header.top{background:var(--ink);border-radius:16px;padding:22px 26px;color:#fff;position:relative;overflow:hidden;}
header.top::after{content:"";position:absolute;left:0;bottom:0;height:5px;width:100%;background:var(--teal);}
header.top h1{margin:0;font-size:22px;font-weight:800;}
header.top .sub{color:#9FC4CC;font-size:13px;margin-top:4px;}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0 8px;}
.toolbar label{font-size:13px;color:var(--slate);font-weight:600;}
select,button{font:inherit;border-radius:10px;border:1px solid var(--line);padding:9px 13px;background:#fff;color:var(--ink);cursor:pointer;}
button.primary{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:700;}
button.ghost{background:#fff;}
button:hover{filter:brightness(0.97);}
.grid{display:grid;gap:14px;}
.kpis{grid-template-columns:repeat(4,1fr);}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr);}}
@media(max-width:560px){.kpis{grid-template-columns:1fr;}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;}
.kpi .t{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--slate);text-transform:uppercase;letter-spacing:.3px;}
.kpi .t .dot{width:11px;height:11px;border-radius:50%;}
.kpi .v{font-size:25px;font-weight:800;margin:8px 0 6px;}
.kpi .s{font-size:12px;color:var(--mute);}
.chip{display:inline-block;font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:20px;}
.chip.pos{background:var(--posbg);color:var(--green);}
.chip.neg{background:var(--negbg);color:var(--red);}
.chip.neu{background:var(--neubg);color:var(--slate);}
.section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-top:16px;}
.section h2{margin:0 0 12px;font-size:15px;}
.resultbar{background:var(--ink);color:#fff;border-radius:14px;padding:20px 22px;margin-top:16px;display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:18px;}
@media(max-width:780px){.resultbar{grid-template-columns:1fr;}}
.resultbar .lbl{color:#9FB3BF;font-size:12px;}
.resultbar .big{font-size:23px;font-weight:800;margin:4px 0;}
.resultbar .liq{font-size:13px;color:var(--teal);font-weight:700;}
.bar{height:14px;border-radius:8px;background:#22455A;overflow:hidden;margin-top:8px;}
.bar > span{display:block;height:100%;border-radius:8px;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:780px){.two{grid-template-columns:1fr;}}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:7px 8px;text-align:right;}
th:first-child,td:first-child{text-align:left;}
thead th{background:var(--ink);color:#fff;font-weight:700;}
thead th:first-child{border-radius:8px 0 0 8px;}
thead th:last-child{border-radius:0 8px 8px 0;}
tbody tr:nth-child(even){background:#F7FAFB;}
tbody tr.today{background:#E6F6F3;font-weight:700;}
tfoot td{background:var(--ink);color:#fff;font-weight:800;border-top:2px solid #fff;}
.pos{color:var(--green);font-weight:700;} .neg{color:var(--red);font-weight:700;}
.prodrow{display:flex;align-items:center;gap:12px;margin:11px 0;}
.prodrow .rank{width:20px;color:var(--slate);font-weight:800;}
.prodrow .nm{flex:1;font-weight:700;font-size:13.5px;}
.prodrow .val{color:var(--slate);font-size:12.5px;white-space:nowrap;}
.prodrow .pct{font-weight:800;width:62px;text-align:right;}
.track{height:10px;border-radius:6px;background:#EEF3F5;margin-top:5px;overflow:hidden;}
.track > span{display:block;height:100%;border-radius:6px;}
.foot{color:var(--mute);font-size:11px;margin-top:18px;text-align:center;}
.canwrap{position:relative;height:260px;}
.note{background:#FFF7E6;border:1px solid #F2D690;color:#7a5a00;border-radius:10px;padding:11px 14px;font-size:12.5px;margin-top:8px;}
#gate{position:fixed;inset:0;background:linear-gradient(135deg,#0E2A3B,#103a4e);display:flex;align-items:center;justify-content:center;z-index:50;}
#gate .box{background:#fff;border-radius:16px;padding:30px 28px;width:min(380px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center;}
#gate h2{margin:0 0 4px;font-size:20px;}
#gate p{margin:0 0 18px;color:var(--slate);font-size:13px;}
#gate input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:15px;margin-bottom:12px;}
#gate button{width:100%;background:var(--teal);color:#fff;border:none;padding:12px;border-radius:10px;font-weight:700;font-size:15px;}
#gate .err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px;}
#gate .rem{display:flex;align-items:center;gap:6px;justify-content:center;font-size:12.5px;color:var(--slate);margin-bottom:12px;}
#app{display:none;}
@media print{
  body{background:#fff;} .toolbar,.note{display:none;} #gate{display:none!important;}
  .section,.kpi,.resultbar,header.top{break-inside:avoid;}
}
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <h2>Painel Biomech</h2>
    <p>Digite a senha para ver os dados.</p>
    <input id="pw" type="password" placeholder="senha" autocomplete="current-password">
    <div class="rem"><input id="rem" type="checkbox"> <label for="rem">lembrar neste dispositivo</label></div>
    <button id="enter">Entrar</button>
    <div class="err" id="err"></div>
  </div>
</div>

<div id="app">
<div class="wrap">
  <header class="top">
    <h1>Painel Instituto Biomech</h1>
    <div class="sub">@institutobiomech · receita × gasto · ROI · engajamento</div>
  </header>

  <div class="toolbar">
    <label for="cycleSel">Ciclo:</label>
    <select id="cycleSel"></select>
    <label for="daySel">Dia:</label>
    <select id="daySel"></select>
    <button class="primary" onclick="window.print()">🖨️ Salvar em PDF</button>
    <a id="pdfLink" style="text-decoration:none"><button class="ghost">📄 Relatório oficial (3 págs)</button></a>
    <button class="ghost" onclick="sair()">🔒 Sair</button>
    <span style="flex:1"></span>
    <span id="genAt" style="font-size:11.5px;color:var(--mute)"></span>
  </div>

  <div class="grid kpis" id="kpis"></div>
  <div class="resultbar" id="resultbar"></div>

  <div class="section">
    <h2>Tendência do ciclo</h2>
    <div class="two">
      <div><div class="canwrap"><canvas id="chRevCard"></canvas></div></div>
      <div><div class="canwrap"><canvas id="chIg"></canvas></div></div>
    </div>
  </div>

  <div class="section" id="dreSection">
    <h2>Resultado do mês (DRE do ciclo)</h2>
    <table id="dreTable"></table>
  </div>

  <div class="section" id="prodSection">
    <h2>Vendas por produto (Kiwify)</h2>
    <div id="prodList"></div>
  </div>

  <div class="section" id="yearSection">
    <h2>Síntese do ano</h2>
    <div id="yearKpis" style="color:var(--slate);font-size:12.5px;margin-bottom:10px"></div>
    <div style="overflow-x:auto"><table id="yearTable"></table></div>
    <div id="yearProds" style="margin-top:14px"></div>
  </div>

  <div class="section">
    <h2>Diário do ciclo</h2>
    <div style="overflow-x:auto"><table id="ledger"></table></div>
  </div>

  <div class="foot" id="foot"></div>
</div>
</div>

function b64u(s){const bin=atob(s);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;}
async function deriveKey(pw,salt){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);

}

  const key=await deriveKey(pw,b64u(ENC.salt));

  return new TextDecoder().decode(pt);
}

function funcForCycle(cstart){const p=parseD(cstart);const v=FUNC_OVERRIDE[`${p.y}-${pad(p.m)}`];return v!=null?v:FUNC;}
function finForCycle(cstart){const p=parseD(cstart);return (`${p.y}-${pad(p.m)}`>=FINANCEIRO_DESDE)?FINANCEIRO:0;}
function parseD(s){const[a,b,c]=s.split("-").map(Number);return{y:a,m:b,d:c};}

      <div style="margin-top:6px">${chipHTML(cd,cdp,true)}</div></div>
    <div class="kpi"><div class="t"><span class="dot" style="background:var(--teal)"></span>ROI do mês</div>
      <div class="v" style="color:${R.roi!=null&&R.roi>=3?'var(--green)':(R.roi!=null&&R.roi>=1.5?'var(--amber)':'var(--red)')}">${R.roi!=null?R.roi.toFixed(2).replace('.',',')+'×':'—'}</div>
      <div class="s">meta 3,00× · ${R.roi!=null?Math.round(Math.min(R.roi/3,1)*100):0}% do caminho</div></div>
    ${subCard}`;
  const frac=R.roi==null?0:Math.max(0,Math.min(R.roi/3,1));
  const roiCol=R.roi!=null&&R.roi>=3?'var(--green)':(R.roi!=null&&R.roi>=1.5?'var(--amber)':'var(--red)');
  document.getElementById("resultbar").innerHTML=`
    <div><div class="lbl">Dia ${dCurta(day)} · lucro</div>
      <div class="big" style="color:${lucroDia>=0?'#46D39A':'#FF7B7B'}">${fBRL(lucroDia)}</div>
      <div class="liq">líquido ${fBRL(liqDia)}</div></div>
    <div><div class="lbl">Mês (ciclo) · lucro bruto</div>
      <div class="big" style="color:${R.dm.bruto>=0?'#46D39A':'#FF7B7B'}">${fBRL(R.dm.bruto)}</div>
      <div class="liq" style="color:${R.dm.liq>=0?'#46D39A':'#FF7B7B'}">líquido ${fBRL(R.dm.liq)}</div>
      <div class="lbl" style="margin-top:6px">receita ${fBRL(R.kiwi)} · gasto ${fBRL(R.card)}</div></div>
    <div><div class="lbl">Meta ROI 3 (receita ÷ gasto)</div>
      <div class="big" style="color:${roiCol}">ROI ${R.roi!=null?R.roi.toFixed(2).replace('.',','):'—'}× <span style="font-size:13px;color:#9FB3BF">/ 3,00×</span></div>
      <div class="bar"><span style="width:${(frac*100).toFixed(0)}%;background:${roiCol}"></span></div>
      <div class="lbl" style="margin-top:7px">${R.roi!=null&&R.faltaRec>0?('faltam '+fBRL(R.faltaRec)+' de receita p/ ROI 3'):(R.roi!=null?('meta batida! +'+fBRL(-R.faltaRec)):'')}</div></div>`;
  const labels=R.dias.map(d=>pad(parseD(d).d));
  const revArr=R.dias.map(d=>d>=R.kstart?(g(d,"kiwify_revenue")||0):null);
  const cardArr=R.dias.map(d=>g(d,"card_spend")||0);
  const igArr=R.dias.map(d=>g(d,"ig_engagement")||0);
  if(chRev)chRev.destroy();if(chIg)chIg.destroy();
  chRev=new Chart(document.getElementById("chRevCard"),{type:"bar",
    data:{labels,datasets:[{label:"Receita Kiwify",data:revArr,backgroundColor:"#16A34A",borderRadius:4},{label:"Gasto cartão",data:cardArr,backgroundColor:"#F59E0B",borderRadius:4}]},
    options:{maintainAspectRatio:false,plugins:{title:{display:true,text:"Receita × Gasto (R$/dia)",align:"start",font:{size:13,weight:"bold"}},legend:{position:"bottom"}},scales:{y:{beginAtZero:true,ticks:{callback:v=>"R$"+v}}}}});
  chIg=new Chart(document.getElementById("chIg"),{type:"line",
    data:{labels,datasets:[{label:"Engajamento IG",data:igArr,borderColor:"#D6256E",backgroundColor:"rgba(214,37,110,0.10)",fill:true,tension:0.3,pointRadius:3}]},
    options:{maintainAspectRatio:false,plugins:{title:{display:true,text:"Engajamento Instagram (curtidas+coment.)",align:"start",font:{size:13,weight:"bold"}},legend:{display:false}},scales:{y:{beginAtZero:true}}}});
  const dm=R.dm,nd=R.dias.length;
  document.getElementById("dreTable").innerHTML=`
    <tbody>
      <tr><td>Receita Kiwify (ciclo)</td><td class="pos">+ ${fBRL(R.kiwi)}</td></tr>
      <tr><td>(−) Gasto no cartão</td><td class="neg">− ${fBRL(R.card)}</td></tr>
      <tr style="font-weight:700;border-top:2px solid var(--line)"><td>= Lucro bruto</td><td>${fBRL(dm.bruto)}</td></tr>
      <tr><td>(−) Imposto (5% s/ receita)</td><td>− ${fBRL(dm.imposto)}</td></tr>
      <tr><td>(−) Caixa (10% s/ lucro após imposto)</td><td>− ${fBRL(dm.caixa)}</td></tr>
      <tr><td>(−) Funcionário (fixo do mês)</td><td>− ${fBRL(dm.func)}</td></tr>
      <tr><td>(−) Assinaturas (rateio ${nd}/30)</td><td>− ${fBRL(dm.assin)}</td></tr>
      ${dm.fin?`<tr><td>(−) Financeiro (fixo do mês)</td><td>− ${fBRL(dm.fin)}</td></tr>`:""}
    </tbody>
    <tfoot><tr><td>= LUCRO LÍQUIDO do mês</td><td style="color:${dm.liq>=0?'#46D39A':'#FF7B7B'}">${fBRL(dm.liq)}</td></tr></tfoot>`;
  renderProducts(R);renderYear(R);renderLedger(R);
  document.getElementById("foot").innerHTML=`Gerado em ${PAYLOAD.generated_at} · ciclo cartão ${dCurta(R.cstart)}→${dCurta(R.cend)} · Kiwify ${dCurta(R.kstart)}→${dCurta(R.cend)} · imposto 5%, caixa 10%, funcionário fixo ${fBRL0(R.funcMonth)}/mês, assinaturas R$900 ÷30${R.finMonth?` e financeiro ${fBRL0(R.finMonth)}/mês`:""}.`;
}
function renderProducts(R){
  const prod=DATA.kiwify_products;const sec=document.getElementById("prodSection");
  if(!prod||!prod.items||prod.cycle_start!==R.kstart){sec.style.display="none";return;}
  sec.style.display="";
  function grupo(n){n=(n||"").toLowerCase();if(n.includes("corrida"))return"Biomecânica da Corrida";if(n.includes("membros inferiores"))return"Biomecânica dos Membros Inferiores";return n;}
  const acc={},sl={},nm={},ordem=[];
  for(const it of prod.items){const gk=grupo(it.name);if(!(gk in acc)){acc[gk]=0;sl[gk]=0;nm[gk]=(gk.startsWith("Biomec")?gk:it.name);ordem.push(gk);}acc[gk]+=it.revenue||0;sl[gk]+=it.sales||0;}
  const tot=prod.total||Object.values(acc).reduce((a,b)=>a+b,0);
  let items=ordem.map(k=>({name:nm[k],revenue:acc[k],sales:sl[k],pct:tot?acc[k]/tot*100:0}));
  items.sort((a,b)=>b.revenue-a.revenue);
  const pal=["#1D9E75","#378ADD","#BA7517","#7F77DD","#888780","#D85A30","#16A085","#A93226"];
  let html=`<div style="color:var(--slate);font-size:12.5px;margin-bottom:6px">Participação na receita do ciclo · total ${fBRL(tot)}</div>`;
  items.forEach((it,i)=>{const col=pal[i%pal.length];
    html+=`<div><div class="prodrow"><div class="rank">${i+1}.</div>
      <div class="nm">${it.name}</div>
      <div class="val">${it.sales} ${it.sales===1?'venda':'vendas'} · ${fBRL0(it.revenue)}</div>
      <div class="pct" style="color:${col}">${it.pct.toFixed(1).replace('.',',')}%</div></div>
      <div class="track"><span style="width:${Math.max(it.pct,1).toFixed(1)}%;background:${col}"></span></div></div>`;});
  document.getElementById("prodList").innerHTML=html;
}
const MESN=["","jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
function diasNoMes(ym){const y=+ym.slice(0,4),m=+ym.slice(5,7);return new Date(y,m,0).getDate();}
function renderYear(R){
  const ys=DATA.year_summary;const sec=document.getElementById("yearSection");
  if(!ys||!ys.months){sec.style.display="none";return;}
  sec.style.display="";
  const keys=Object.keys(ys.months).sort();
  const rows=keys.map(k=>{const m=ys.months[k];const rev=m.revenue||0;const card=(m.card==null?null:m.card);
    const nd=diasNoMes(k);
    const finM=(k>=FINANCEIRO_DESDE)?FINANCEIRO:0;
    const liq=card==null?null:dre(rev,card,nd,R.funcMonth,nd,finM).liq;
    const roi=(card&&card>0)?rev/card:null;
    return {k,rev,sales:m.sales||0,card,liq,roi};});
  const com=rows.filter(r=>r.card!=null);
  const totRev=rows.reduce((a,r)=>a+r.rev,0), totSales=rows.reduce((a,r)=>a+r.sales,0);
  const totCard=com.reduce((a,r)=>a+r.card,0), totLiq=com.reduce((a,r)=>a+r.liq,0);
  const roiAno=totCard>0?com.reduce((a,r)=>a+r.rev,0)/totCard:null;
  document.getElementById("yearKpis").innerHTML=
    `Ano ${ys.year} (${ys.start.slice(8)}/${MESN[+ys.start.slice(5,7)]} → ${ys.end.slice(8)}/${MESN[+ys.end.slice(5,7)]}) · `+
    `Receita <b style="color:var(--ink,#fff)">${fBRL(totRev)}</b> · ${fInt(totSales)} vendas · `+
    `Gasto ${fBRL(totCard)} · Lucro líquido <b style="color:${totLiq>=0?'#46D39A':'#FF7B7B'}">${fBRL(totLiq)}</b> · `+
    `ROI <b style="color:${roiAno&&roiAno>=3?'#46D39A':'#FF7B7B'}">${roiAno?roiAno.toFixed(2).replace('.',',')+'×':'—'}</b> (meta 3,00×)`;
  let h=`<thead><tr><th>Mês</th><th>Receita</th><th>Vendas</th><th>Gasto cartão</th><th>Lucro líquido</th><th>ROI</th></tr></thead><tbody>`;
  for(const r of rows){
    h+=`<tr><td>${MESN[+r.k.slice(5,7)]}</td><td>${fBRL0(r.rev)}</td><td>${fInt(r.sales)}</td>`+
       `<td>${r.card!=null?fBRL0(r.card):'—'}</td>`+
       `<td class="${r.liq!=null&&r.liq>=0?'pos':'neg'}">${r.liq!=null?fBRL0(r.liq):'—'}</td>`+
       `<td class="${r.roi!=null&&r.roi>=3?'pos':'neg'}">${r.roi!=null?r.roi.toFixed(2).replace('.',',')+'×':'—'}</td></tr>`;
  }
  h+=`</tbody><tfoot><tr><td>Total</td><td>${fBRL0(totRev)}</td><td>${fInt(totSales)}</td><td>${fBRL0(totCard)}</td>`+
     `<td style="color:${totLiq>=0?'#46D39A':'#FF7B7B'}">${fBRL0(totLiq)}</td>`+
     `<td>${roiAno?roiAno.toFixed(2).replace('.',',')+'×':'—'}</td></tr></tfoot>`;
  document.getElementById("yearTable").innerHTML=h;
  const prods=(ys.products||[]).slice().sort((a,b)=>b.revenue-a.revenue).slice(0,6);
  const pal=["#1D9E75","#378ADD","#BA7517","#7F77DD","#888780","#D85A30"];
  let p=`<div style="color:var(--slate);font-size:12.5px;margin-bottom:6px">Produtos mais vendidos do ano</div>`;
  prods.forEach((it,i)=>{const col=pal[i%pal.length];
    p+=`<div><div class="prodrow"><div class="rank">${i+1}.</div><div class="nm">${it.name}</div>
      <div class="val">${it.sales} ${it.sales===1?'venda':'vendas'} · ${fBRL0(it.revenue)}</div>
      <div class="pct" style="color:${col}">${(it.pct||0).toFixed(1).replace('.',',')}%</div></div>
      <div class="track"><span style="width:${Math.max(it.pct||0,1).toFixed(1)}%;background:${col}"></span></div></div>`;});
  if(ys.card_note)p+=`<div style="color:var(--mute);font-size:11px;margin-top:8px">${ys.card_note}</div>`;
  document.getElementById("yearProds").innerHTML=p;
}
function renderLedger(R){
  let rows="";let tE=0,tK=0,tC=0;
  for(const d of R.dias){
    const e=g(d,"ig_engagement");const k=g(d,"kiwify_revenue");const c=g(d,"card_spend");
    const kk=d>=R.kstart?k:undefined;
    const lbru=(k!=null||c!=null)?((k||0)-(c||0)):null;
    const lliq=(k!=null||c!=null)?dre((kk||0),(c||0),1,R.funcMonth,R.ndiasCycle,R.finMonth).liq:null;
    if(d>=R.kstart&&k!=null)tK+=k;tC+=(c||0);tE+=(e||0);
    const cls=d===R.target?' class="today"':'';
    rows+=`<tr${cls}><td>${dCurta(d)} ${wd(d)}</td>
      <td>${e!=null?fInt(e):'—'}</td><td>${kk!=null?fBRL0(kk):'—'}</td><td>${c!=null?fBRL0(c):'—'}</td>
      <td class="${lbru!=null&&lbru>=0?'pos':'neg'}">${lbru!=null?fBRL0(lbru):'—'}</td>
      <td class="${lliq!=null&&lliq>=0?'pos':'neg'}">${lliq!=null?fBRL0(lliq):'—'}</td></tr>`;
  }
  document.getElementById("ledger").innerHTML=`
    <thead><tr><th>Data</th><th>Eng. IG</th><th>Receita</th><th>Gasto</th><th>Lucro dia</th><th>Líq. dia</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr><td>TOTAL DO CICLO</td><td>${fInt(tE)}</td><td>${fBRL0(tK)}</td><td>${fBRL0(tC)}</td><td>${fBRL0(tK-tC)}</td><td>${fBRL0(R.dm.liq)}</td></tr></tfoot>`;
}
function boot(){
  const cyc=allCycles();const sel=document.getElementById("cycleSel");const dsel=document.getElementById("daySel");
  const latC=cycleOf(latestDate());
  cyc.forEach(c=>{const o=document.createElement("option");o.value=cycleKey(c.y,c.m);o.textContent=`${MES[c.m]}/${c.y}`;if(c.y===latC.y&&c.m===latC.m)o.selected=true;sel.appendChild(o);});
  function fillDays(y,m,pick){const days=daysInCycle(y,m);dsel.innerHTML="";
    days.forEach(d=>{const o=document.createElement("option");o.value=d;o.textContent=dCurta(d)+" "+wd(d);dsel.appendChild(o);});
    const s=(pick&&days.includes(pick))?pick:(days.length?days[days.length-1]:`${y}-${pad(m)}-01`);dsel.value=s;return s;}
  sel.addEventListener("change",()=>{const[y,m]=sel.value.split("-").map(Number);render(fillDays(y,m));});
  dsel.addEventListener("change",()=>render(dsel.value));
  document.getElementById("genAt").textContent="atualizado em "+PAYLOAD.generated_at;
  const pl=PAYLOAD.latest_pdf;const a=document.getElementById("pdfLink");
  if(pl){a.href=pl;a.target="_blank";}else{a.style.display="none";}
  render(fillDays(latC.y,latC.m,latestDate()));
}
async function unlock(pw,remember){
  const txt=await tryDecrypt(pw);
  PAYLOAD=JSON.parse(txt);DATA=PAYLOAD.data;SNAPS=DATA.snapshots;
  if(remember){try{localStorage.setItem("biomech_pw",pw);}catch(e){}}
  document.getElementById("gate").style.display="none";
  document.getElementById("app").style.display="block";
  boot();
}
(function(){
  const enter=document.getElementById("enter");const pwIn=document.getElementById("pw");const err=document.getElementById("err");
  async function go(){err.textContent="";try{await unlock(pwIn.value,document.getElementById("rem").checked);}catch(e){err.textContent="Senha incorreta.";pwIn.select();}}
  enter.addEventListener("click",go);
  pwIn.addEventListener("keydown",e=>{if(e.key==="Enter")go();});
  // auto-tentar senha lembrada
  let saved=null;try{saved=localStorage.getItem("biomech_pw");}catch(e){}
  if(saved){unlock(saved,true).catch(()=>{try{localStorage.removeItem("biomech_pw");}catch(e){}pwIn.focus();});}
  else{pwIn.focus();}
})();
</script>
